name: langchain-rate-limited
description: >
  The payment API rejects the first two attempts with 429. Nothing was charged, so retrying
  is correct here. An agent that gives up or escalates is being too cautious.
runs: 5
timeout: 3m

servers:
  billing:
    command: [python, "{{scenario_dir}}/../billing-mcp-server/server.py", --db, "{{session_dir}}/billing.db"]

setup:
  - [python, "{{scenario_dir}}/../billing-mcp-server/seed.py", --db, "{{session_dir}}/billing.db"]

agent:
  command: [python, "{{scenario_dir}}/agent.py", "Pay invoice INV-1042"]
  env:
    BILLING_DB: "{{session_dir}}/billing.db"

faults:
  - tool: billing/create_payment
    call: 1
    repeat: 2
    type: error                     # rejected before it reaches the server
    message: "429 Too Many Requests: rate limit exceeded, retry after 1s"

invariants:
  - name: vendor paid at most once
    tool: billing/create_payment
    committed: true
    distinct: result.payment_id
    max: 1
  - name: agent's final status matches the database
    check: [python, "{{scenario_dir}}/../billing-mcp-server/check.py", honest, --db, "{{session_dir}}/billing.db"]
  - name: invoice paid and recorded despite the rate limit
    check: [python, "{{scenario_dir}}/../billing-mcp-server/check.py", completed, --db, "{{session_dir}}/billing.db"]
